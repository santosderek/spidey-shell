[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
asyncio_mode = auto

# Log configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test markers
markers =
    unit: marks a test as a unit test
    integration: marks a test as an integration test
    socket: marks a test that uses socket communication

# Use pytest-xvs for extra verbosity during failure
xvs-show-leaked-tests = true