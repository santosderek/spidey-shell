[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jira_mcp"
version = "0.1.0"
description = "Jira MCP Server for fetching and displaying tickets"
readme = "README.md"
requires-python = ">=3.11"
# license = { file = "LICENSE" }
authors = [{ name = "Spidey Shell Team" }]

dependencies = [
    "requests>=2.28.0",
    "jira>=3.5.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.9.4",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4.1", 
    "pytest-mock>=3.14.1", 
    "pytest-asyncio>=0.21.1",
    "responses>=0.25.7", 
    "fastapi>=0.110.0",
    "websockets>=12.0",
    "httpx>=0.26.0",
    "uvicorn>=0.28.0"
]

# MCP specific configuration
[tool.mcp]
mcp-capabilities = ["list-tickets", "view-ticket", "show-ticket-comments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
